[project]
name = "stockpilot-ai-backend"
version = "0.1.0"
description = "FastAPI backend for StockPilot AI"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

